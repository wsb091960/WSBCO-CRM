name: MCP prototype validation
on:
  push:
    branches: [feature/mcp-readonly-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app and MCP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 'mcp>=1.0,<2'
      - name: Compile prototype
        run: python -m compileall -q mcp_prototype
      - name: Static and functional tests (synthetic only)
        run: python -m unittest discover -s mcp_prototype -p 'test_*.py' -v
