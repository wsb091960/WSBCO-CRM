<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}WSBCO Medicare Sales Platform{% endblock %}</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <link
    rel="stylesheet"
    href="/static/css/app.css?v=2.1"
  >
</head>

<body>
  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand">
        <div class="logo">W</div>
        <div>
          <h3>WSBCO</h3>
          <small>Medicare Sales Platform</small>
        </div>
      </div>

      <nav>
        <a href="/">Dashboard</a>
        <a href="/leads">Contacts</a>
        <a href="/dialer">Power Dialer</a>
      </nav>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=2.1"></script>
</body>
</html>
